<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    /> -->
    <title>Elani Beauty Medical Clinic — HRM</title>
    <script>
      // Chuyển hướng domain cũ sang domain chính thức, giữ nguyên đường dẫn người
      // dùng đang mở (cho ai đã lưu bookmark cũ).
      //
      // Đặt trong <head>, chạy TRƯỚC khi tải bundle ứng dụng để khỏi mất công
      // render rồi mới nhảy. Cloudflare Pages không cho redirect theo hostname
      // trong file _redirects nên phải làm ở đây.
      //
      // So khớp CHÍNH XÁC hostname production — các bản preview của Pages nằm ở
      // <hash>.alan-hrm.pages.dev, không được đụng tới.
      //
      // Lối thoát: thêm ?stay vào URL để ở lại domain cũ, phòng khi domain mới
      // có sự cố mà vẫn cần vào gấp.
      //
      // KHÔNG dùng cờ sessionStorage để chặn lặp: điều kiện đã là "đang ở đúng
      // hostname cũ", mà sau khi chuyển thì hostname khác đi nên không thể lặp.
      // Bản đầu có cờ đó và hoá ra nó chặn luôn mọi lần vào sau trong cùng phiên
      // trình duyệt — vào lại domain cũ là ở nguyên đó, không chuyển nữa.
      (function () {
        var CU = 'alan-hrm.pages.dev';
        var MOI = 'hr.elani.com.vn';
        if (location.hostname === CU && location.search.indexOf('stay') === -1) {
          location.replace('https://' + MOI + location.pathname + location.search + location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
